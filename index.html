<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matchups</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; padding: 10px 12px;
    font: 400 clamp(10px, 1.55vh, 15px)/1.2 system-ui, sans-serif;  /* scales with window height */
    background: #f1f3ec; color: #16241b; overflow: hidden;
  }

  /* Header: title + legend on the left, refresh timer exactly in the middle, crown on the right */
  .topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
            gap: 16px; margin: 0 0 8px; flex: none; }
  .left { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; min-width: 0; }
  h1 { margin: 0; font-size: 1.5em; }
  .legend { display: flex; gap: 12px; font-size: .85em; }
  .legend span::before { content: ""; display: inline-block; width: .9em; height: .9em; margin-right: 5px;
                         vertical-align: -.1em; border: 1px solid #b8bdb0; border-radius: 2px; background: var(--c); }

  /* Time since the last successful refresh; turns amber when late and red when the last refresh failed */
  .timer { font-size: .85em; font-variant-numeric: tabular-nums; white-space: nowrap; padding: 2px 10px;
           border-radius: 999px; background: #e6e9df; color: #4b5a50; }
  .timer.stale { background: #f3d9a4; color: #6b4a00; }
  .timer.err { background: #f0c4bb; color: #8a2a16; }

  /* Right side of the header: crown + team with the most points this week */
  .king { justify-self: end; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .king[hidden] { display: none; }   /* needed because .king sets display:flex */
  .king img { height: 2.8em; width: auto; flex: none; }
  .king .who { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .king .who b { font-size: 1.15em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .king .who span { font-size: .85em; opacity: .75; font-variant-numeric: tabular-nums; }

  /* 3 columns x 2 rows, filling the remaining viewport height */
  .grid { flex: 1; min-height: 0; display: grid; gap: 10px;
          grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(2, minmax(0, 1fr)); }

  .card { display: flex; flex-direction: column; min-height: 0; background: #fff;
          border: 1px solid #d5dacd; border-radius: 8px; padding: 8px 10px; }

  /* Matchup header: dark frame, one block per team; both blocks are exactly the same width and height */
  .head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; padding: 4px; margin-bottom: 4px;
          background: #26404F; border-radius: 6px; font-weight: 600; flex: none; }
  .side { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; margin: 0;
          padding: 3px 8px; border-radius: 4px; background: #fff; }
  .side.lead { background: #A5BA86; }       /* higher projected points */
  .side.b { flex-direction: row-reverse; }  /* mirror: score left, name right */
  .side.b .info { text-align: right; }
  .info { display: flex; flex-direction: column; min-width: 0; }
  .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj { font-weight: 400; font-size: .8em; opacity: .75; }
  .tot { font-size: 1.6em; font-variant-numeric: tabular-nums; flex: none; }

  /* Player rows: two equal halves (team A | team B), each coloured by game status */
  .r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; flex: 1; min-height: 0;
       padding: 1px 0; border-bottom: 1px solid #e6e9df; }
  .r:last-child { border-bottom: 0; }
  .half { display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 6px; border-radius: 4px; }
  .half.b { flex-direction: row-reverse; }  /* mirror: projection and score towards the centre */
  .half .nm { flex: 1; display: flex; align-items: baseline; min-width: 0; }  /* position | name (shrinks) | number */
  .half.b .nm { justify-content: flex-end; }
  .half .nm, .half b { font-size: 1.15em; }  /* player names and points: one size bigger */
  .half b { position: relative; min-width: 2.6em; text-align: center; font-variant-numeric: tabular-nums; }
  .half i { min-width: 2.2em; text-align: center; font-style: normal; font-size: .8em; opacity: .65;
            font-variant-numeric: tabular-nums; }
  .half.post { background: #C7C7C7; }   /* game finished */
  .half.live { background: #AEC5CF; }   /* game in progress */
  .pos { flex: none; color: #2f6b4f; font-size: .8em; margin-right: 4px; }
  .pn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* only the name gets cut off */
  .no { flex: none; margin-left: 4px; font-size: .8em; opacity: .65; }

  /* Points gained since the last refresh: small badge above the score, so row layout never shifts */
  .d { position: absolute; top: -.55em; right: -.5em; font-style: normal; font-size: .65em; font-weight: 700;
       color: #1f6b3a; white-space: nowrap; }
  .half.b .d { right: auto; left: -.5em; }   /* mirrored side: badge towards the centre as well */
  .d.neg { color: #c0442b; }

  /* Small screens: fall back to one scrolling column */
  @media (max-width: 900px) {
    body { overflow: auto; height: auto; }
    .topbar { grid-template-columns: minmax(0, 1fr); gap: 6px; }
    .timer, .king { justify-self: start; }
    .grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
    .r { padding: 5px 0; flex: none; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="left">
    <h1 id="title">Matchups</h1>
    <div class="legend">
      <span style="--c:#AEC5CF">Live</span>
      <span style="--c:#C7C7C7">Finished</span>
      <span style="--c:#A5BA86">Higher projection</span>
    </div>
  </div>
  <div class="timer" id="timer">Loading...</div>
  <!-- crown.png must sit in the same folder as this file -->
  <div class="king" id="king" hidden>
    <img src="crown.png" alt="">
    <div class="who"><b id="kingName"></b><span id="kingPts"></span></div>
  </div>
</div>
<div class="grid" id="grid"></div>

<script>
const USER = 'koenifra';
const LEAGUE_INDEX = 0;             // which of your leagues to show
const REFRESH_MS = 30000;           // scores and game status refresh interval
const STALE_MS = REFRESH_MS * 2.5;  // timer turns amber when the data is older than this
const DELTA_HOLD_MS = REFRESH_MS;   // how long a "+x.xx" badge stays visible (raise it to keep badges longer)
const PROJ_TTL = 600000;            // projections are re-fetched at most every 10 min
const API = 'https://api.sleeper.app/v1';
const PROJ_API = 'https://api.sleeper.com/projections/nfl';  // undocumented endpoint, different domain
const ESPN = 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';  // unofficial, used for live game status
const ESPN_FIX = { WSH: 'WAS' };  // ESPN abbreviation -> Sleeper abbreviation

// fetch JSON: never use the browser cache, and give up after `ms` so a hung request cannot block refreshes
const get = async (u, ms = 15000) => {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try {
    const r = await fetch(u, { cache: 'no-store', signal: ac.signal });
    if (!r.ok) throw new Error(`HTTP ${r.status} for ${u}`);
    return await r.json();
  } finally { clearTimeout(t); }
};
const fmt = n => (n ?? 0).toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// "Josh Allen" -> "J. Allen"; defenses keep their full name (e.g. "Buffalo Bills")
const shortName = (id, p) => {
  if (p.position === 'DEF') return `${p.first_name || ''} ${p.last_name || ''}`.trim() || p.full_name || id;
  const f = (p.first_name || '').trim(), l = (p.last_name || '').trim();
  return f && l ? `${f[0]}. ${l}` : (p.full_name || l || f || id);
};

// Player id -> [short name, position, team, jersey number]; cached for 24 h (the full dump is ~5 MB)
async function loadPlayers() {
  try { const c = JSON.parse(localStorage.getItem('sl_players3')); if (c && Date.now() - c.t < 864e5) return c.d; } catch {}
  const raw = await get(`${API}/players/nfl`, 60000), d = {};
  for (const [id, p] of Object.entries(raw))
    d[id] = [shortName(id, p), p.position || '', p.team || (p.position === 'DEF' ? id : ''), p.number ?? ''];
  try { localStorage.setItem('sl_players3', JSON.stringify({ t: Date.now(), d })); } catch {}
  return d;
}

// Player id -> projected fantasy points, computed with this league's own scoring settings
let projCache = { t: 0, d: {} };
async function loadProjections() {
  if (Date.now() - projCache.t < PROJ_TTL) return projCache.d;
  const { state, league } = ctx;
  const pos = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'].map(p => `position[]=${p}`).join('&');
  const rows = await get(`${PROJ_API}/${state.season}/${state.week}?season_type=regular&${pos}`);
  const sc = league.scoring_settings || {}, d = {};
  for (const r of rows) {
    const s = r.stats || {};
    // Sum stat * league points-per-stat; fall back to Sleeper's own PPR number if nothing matched
    let pts = 0;
    for (const k in sc) pts += (s[k] || 0) * sc[k];
    d[r.player_id] = pts || s.pts_ppr || 0;
  }
  projCache = { t: Date.now(), d };
  return d;
}

// NFL team abbreviation -> game state: 'pre' (not started), 'in' (live) or 'post' (finished)
async function loadGameStates() {
  const type = { pre: 1, regular: 2, post: 3 }[ctx.state.season_type] || 2;
  const data = await get(`${ESPN}?week=${ctx.state.week}&seasontype=${type}`);
  const out = {};
  for (const ev of data.events || []) {
    const st = ev.status?.type?.state;
    for (const c of ev.competitions?.[0]?.competitors || []) {
      const ab = c.team?.abbreviation;
      if (ab) out[ESPN_FIX[ab] || ab] = st;
    }
  }
  return out;
}

let ctx;               // league context, loaded once
const lastPts = {};    // "rosterId:playerId" -> points seen at the previous refresh
const deltas = {};     // "rosterId:playerId" -> { d: points gained, t: time of the change }

async function init() {
  const state = await get(`${API}/state/nfl`);
  const user = await get(`${API}/user/${USER}`);
  const leagues = await get(`${API}/user/${user.user_id}/leagues/nfl/${state.season}`);
  const league = leagues[LEAGUE_INDEX];
  const [rosters, users, players] = await Promise.all([
    get(`${API}/league/${league.league_id}/rosters`),
    get(`${API}/league/${league.league_id}/users`),
    loadPlayers(),
  ]);
  // roster_id -> team name
  const names = {};
  for (const r of rosters) {
    const u = users.find(x => x.user_id === r.owner_id);
    names[r.roster_id] = u ? (u.metadata?.team_name || u.display_name) : `Team ${r.roster_id}`;
  }
  ctx = { state, league, names, players };
  document.getElementById('title').textContent = `${league.name} - Week ${state.week}`;
}

async function render() {
  const { state, league, names, players } = ctx;
  // Projections and game status are optional: if one fails, the page still works without it
  const [matchups, proj, games] = await Promise.all([
    get(`${API}/league/${league.league_id}/matchups/${state.week}`),
    loadProjections().catch(e => { console.warn('Projections unavailable:', e); return {}; }),
    loadGameStates().catch(e => { console.warn('Game status unavailable:', e); return {}; }),
  ]);
  const now = Date.now();

  // Compare every starter's points with the previous refresh (the first load only records a baseline)
  for (const m of matchups) (m.starters || []).forEach((pid, i) => {
    if (pid === '0') return;
    const k = `${m.roster_id}:${pid}`, v = m.starters_points?.[i] ?? 0;
    if (k in lastPts && Math.abs(v - lastPts[k]) > 0.005) deltas[k] = { d: v - lastPts[k], t: now };
    lastPts[k] = v;
  });

  // Team with the most points this week across the whole league (first team wins a tie);
  // the crown block stays hidden until someone has scored
  const best = matchups.reduce((x, m) => (!x || m.points > x.points ? m : x), null);
  const king = document.getElementById('king');
  king.hidden = !best || !(best.points > 0);
  if (!king.hidden) {
    document.getElementById('kingName').textContent = names[best.roster_id] || `Team ${best.roster_id}`;
    document.getElementById('kingPts').textContent = `${fmt(best.points)} pts`;
  }

  // One half of a player row: position, short name + jersey number, actual points (+ gain badge), projection
  const half = (pid, pts, cls, rid) => {
    if (!pid || pid === '0') return `<div class="half ${cls}"><span class="nm">-</span></div>`;
    const [name, pos, team, num] = players[pid] || [pid, '', '', ''];
    const st = games[team] === 'post' ? 'post' : games[team] === 'in' ? 'live' : '';
    const pj = proj[pid];
    const dl = deltas[`${rid}:${pid}`];
    const badge = dl && now - dl.t < DELTA_HOLD_MS
      ? `<em class="d ${dl.d < 0 ? 'neg' : ''}">${dl.d > 0 ? '+' : ''}${dl.d.toFixed(2)}</em>` : '';
    return `<div class="half ${cls} ${st}">
      <span class="nm"><span class="pos">${esc(pos)}</span><span class="pn">${esc(name)}</span>${num !== '' ? `<span class="no">#${esc(num)}</span>` : ''}</span>
      <b>${fmt(pts)}${badge}</b><i>${pj != null ? pj.toFixed(1) : '-'}</i>
    </div>`;
  };

  // Group the two rosters that share a matchup_id
  const groups = new Map();
  for (const m of matchups) {
    if (!groups.has(m.matchup_id)) groups.set(m.matchup_id, []);
    groups.get(m.matchup_id).push(m);
  }

  // Team projection = sum of projected points of the current starters
  const teamProj = m => (m.starters || []).reduce((sum, pid) => sum + (proj[pid] || 0), 0);

  document.getElementById('grid').innerHTML = [...groups.values()].map(([a, b]) => {
    b = b || { roster_id: 0, points: 0, starters: [], starters_points: [] };  // bye week fallback
    const pa = teamProj(a), pb = teamProj(b);
    // Strictly higher projection gets green; equal (or missing) projections leave both white
    const side = (m, own, other, cls) => `
      <div class="side ${cls} ${own > other ? 'lead' : ''}">
        <span class="info">
          <span class="nm">${esc(names[m.roster_id] || 'Bye')}</span>
          <span class="proj">proj ${own.toFixed(1)}</span>
        </span>
        <span class="tot">${fmt(m.points)}</span>
      </div>`;

    const n = Math.max(a.starters.length, b.starters.length);
    // Rows are aligned by lineup slot, so QB sits next to QB, etc.
    const rows = Array.from({ length: n }, (_, i) =>
      `<div class="r">${half(a.starters[i], a.starters_points[i], 'a', a.roster_id)}${half(b.starters[i], b.starters_points[i], 'b', b.roster_id)}</div>`
    ).join('');
    return `
      <div class="card">
        <div class="head">${side(a, pa, pb, 'a')}${side(b, pb, pa, 'b')}</div>${rows}
      </div>`;
  }).join('');
}

// ---- Refresh loop and timer ----
let lastOk = 0;     // time of the last successful refresh
let lastErr = '';   // message of the last failed refresh ('' = last one worked)
let busy = false;   // prevents overlapping refreshes
const timerEl = document.getElementById('timer');

async function refresh() {
  if (busy) return;
  busy = true;
  try {
    if (!ctx) await init();   // if the first load failed, retry it here
    await render();
    lastOk = Date.now(); lastErr = '';
  } catch (e) {
    lastErr = e.name === 'AbortError' ? 'Request timed out' : (e.message || String(e));
    console.error(e);
    if (!lastOk) document.getElementById('grid').textContent = lastErr;   // nothing shown yet
  } finally { busy = false; tick(); }
}

// Updates the timer text every second: "Updated 12 s ago", amber when late, red when the last refresh failed
function tick() {
  if (!lastOk) { timerEl.textContent = lastErr ? 'Load failed - retrying' : 'Loading...'; timerEl.className = 'timer' + (lastErr ? ' err' : ''); return; }
  const ms = Date.now() - lastOk, s = Math.floor(ms / 1000);
  const t = s < 60 ? `${s} s` : `${Math.floor(s / 60)} min ${String(s % 60).padStart(2, '0')} s`;
  timerEl.textContent = lastErr ? `Update failed - last OK ${t} ago` : `Updated ${t} ago`;
  timerEl.className = 'timer' + (lastErr ? ' err' : ms > STALE_MS ? ' stale' : '');
  timerEl.title = lastErr;   // hover shows the error message
}

refresh();
setInterval(refresh, REFRESH_MS);
setInterval(tick, 1000);
// Browsers (and the Fire TV) pause timers while the screen is off: refresh right away when the page comes back
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
